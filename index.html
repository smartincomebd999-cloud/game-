<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini GTA - Perfect Vehicle Seating & Controls</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #hud { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.8); color: white; padding: 12px 16px; border-radius: 10px; border-left: 5px solid #2ecc71; font-size: 14px; z-index: 10; pointer-events: none; min-width: 170px; }
        .hp-bar-bg { width: 100%; height: 10px; background: #444; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .hp-bar-fill { width: 100%; height: 100%; background: #e74c3c; transition: width 0.2s; }
        #btn-fullscreen { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #fff; padding: 8px 12px; border-radius: 6px; z-index: 10; font-size: 12px; }

        #joystick-base { position: absolute; bottom: 35px; left: 35px; width: 130px; height: 130px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; z-index: 10; }
        #joystick-knob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: #ff3b30; border: 2px solid #fff; border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

        .btn-action { position: absolute; bottom: 35px; right: 35px; width: 70px; height: 70px; background: #007bff; border: 2px solid #fff; color: white; font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .btn-action:active { transform: scale(0.92); }
        #btn-attack { bottom: 35px; right: 115px; background: #e74c3c; }

        #btn-vehicle { position: absolute; bottom: 120px; right: 35px; background: #f39c12; color: #fff; padding: 12px 20px; font-weight: bold; border: 2px solid #fff; border-radius: 25px; display: none; z-index: 10; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div id="hud">
        <b>GTA Mini City</b>
        <div style="color:#f1c40f; margin-top:2px;" id="coin-txt">🪙 কয়েন: 0</div>
        <div style="color:#e74c3c; margin-top:2px;" id="gun-txt">🔫 গান: নেই</div>
        <div class="hp-bar-bg"><div id="hp-fill" class="hp-bar-fill"></div></div>
    </div>

    <button id="btn-fullscreen">ফুলস্ক্রিন ⤢</button>
    <button id="btn-vehicle">গাড়িতে উঠুন 🚗</button>

    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div class="btn-action" id="btn-attack">ঘুষি 👊</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- সাউন্ড সিস্টেম ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.body.addEventListener('touchstart', () => { if(audioCtx.state === 'suspended') audioCtx.resume(); }, {once:true});

        function playSound(type) {
            if (audioCtx.state === 'suspended') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'shoot') {
                osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(10, now + 0.15);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'punch') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.1);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'step') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(70, now); osc.frequency.exponentialRampToValueAtTime(10, now + 0.08);
                gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'enter') {
                osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(450, now + 0.15);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            }
        }

        let engineOsc = null, engineGain = null;
        function updateEngineSound(isMoving, speed) {
            if (audioCtx.state === 'suspended') return;
            if (!engineOsc) {
                engineOsc = audioCtx.createOscillator(); engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth'; engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination);
                engineOsc.start(); engineGain.gain.value = 0;
            }
            if (isMoving) {
                engineGain.gain.setTargetAtTime(0.05 + Math.abs(speed)*0.03, audioCtx.currentTime, 0.1);
                engineOsc.frequency.setTargetAtTime(50 + Math.abs(speed)*30, audioCtx.currentTime, 0.1);
            } else {
                engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            }
        }

        // --- বেসিক সেটআপ ---
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        });

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.001);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambientLight);
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(200, 300, 150); sun.castShadow = true; scene.add(sun);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: 0x3a7d44 }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

        const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const roads = [-600, -400, -200, 0, 200, 400, 600];
        roads.forEach(r => {
            let r1 = new THREE.Mesh(new THREE.PlaneGeometry(35, 3000), roadMat);
            r1.rotation.x = -Math.PI / 2; r1.position.set(r, 0.1, 0); scene.add(r1);
            let r2 = new THREE.Mesh(new THREE.PlaneGeometry(3000, 35), roadMat);
            r2.rotation.x = -Math.PI / 2; r2.position.set(0, 0.1, r); scene.add(r2);
        });

        function createEnvironment() {
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const trunkGeo = new THREE.CylinderGeometry(0.6, 0.8, 4);
            const leavesGeo = new THREE.ConeGeometry(3.5, 8, 7);

            for (let i = 0; i < 80; i++) {
                let x = (Math.random() - 0.5) * 1800, z = (Math.random() - 0.5) * 1800;
                if (Math.abs(x % 200) < 30 || Math.abs(z % 200) < 30) continue; 
                let tree = new THREE.Group();
                let trunk = new THREE.Mesh(trunkGeo, trunkMat); trunk.position.y = 2;
                let leaves = new THREE.Mesh(leavesGeo, treeMat); leaves.position.y = 6;
                tree.add(trunk, leaves); tree.position.set(x, 0, z); scene.add(tree);
            }

            const houseGeo = new THREE.BoxGeometry(15, 12, 15);
            const roofGeo = new THREE.ConeGeometry(12, 7, 4); roofGeo.rotateY(Math.PI / 4);
            const colors = [0xe74c3c, 0x3498db, 0xf1c40f, 0x9b59b6, 0xff9f43];

            for (let i = 0; i < 40; i++) {
                let x = (Math.random() - 0.5) * 1800, z = (Math.random() - 0.5) * 1800;
                if (Math.abs(x % 200) < 40 || Math.abs(z % 200) < 40) continue;
                let house = new THREE.Group();
                let body = new THREE.Mesh(houseGeo, new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] }));
                body.position.y = 6;
                let roof = new THREE.Mesh(roofGeo, new THREE.MeshStandardMaterial({ color: 0x2c3e50 }));
                roof.position.y = 15.5;
                house.add(body, roof); house.position.set(x, 0, z); scene.add(house);
            }
        }
        createEnvironment();

        // --- ক্যারেক্টার ও গাড়ি ---
        function buildHuman(shirtColor, pantsColor = 0x112233, isEnemy = false) {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const shirtMat = new THREE.MeshStandardMaterial({ color: isEnemy ? 0xcc0000 : shirtColor });
            const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor });

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), skinMat); head.position.y = 3.6; 
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.2), new THREE.MeshBasicMaterial({ color: 0x111111 }));
            visor.position.set(0, 3.7, -0.62); group.add(visor);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 0.8), shirtMat); torso.position.y = 2.1;

            const armLGroup = new THREE.Group(), armRGroup = new THREE.Group();
            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.6, 0.4), shirtMat); armL.position.y = -0.8; armLGroup.add(armL); armLGroup.position.set(-0.9, 2.8, 0);
            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.6, 0.4), shirtMat); armR.position.y = -0.8; armRGroup.add(armR); armRGroup.position.set(0.9, 2.8, 0);

            const gunMesh = createGunMesh(); gunMesh.position.set(0, -1.4, -0.4); gunMesh.rotation.x = Math.PI / 2; gunMesh.visible = false; armRGroup.add(gunMesh);

            const legLGroup = new THREE.Group(), legRGroup = new THREE.Group();
            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.6, 0.45), pantsMat); legL.position.y = -0.8; legLGroup.add(legL); legLGroup.position.set(-0.4, 1.2, 0);
            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.6, 0.45), pantsMat); legR.position.y = -0.8; legRGroup.add(legR); legRGroup.position.set(0.4, 1.2, 0);

            group.add(head, torso, armLGroup, armRGroup, legLGroup, legRGroup);

            function setPosture(mode) {
                if (mode === 'SIT_BIKE') {
                    // ফিক্সড: মাইনাস (-) রোটেশন মানে হাত-পা সামনের দিকে স্টিয়ারিংয়ের দিকে যাবে
                    legLGroup.rotation.set(-1.2, 0, 0.3); legRGroup.rotation.set(-1.2, 0, -0.3);
                    armLGroup.rotation.set(-1.2, 0.2, 0); armRGroup.rotation.set(-1.2, -0.2, 0);
                    torso.rotation.x = -0.15; 
                } else if (mode === 'SIT_CAR') {
                    legLGroup.rotation.set(-1.4, 0, 0); legRGroup.rotation.set(-1.4, 0, 0);
                    armLGroup.rotation.set(-1.0, 0, 0); armRGroup.rotation.set(-1.0, 0, 0);
                    torso.rotation.x = 0;
                } else { 
                    legLGroup.rotation.set(0,0,0); legRGroup.rotation.set(0,0,0);
                    armLGroup.rotation.set(0,0,0); armRGroup.rotation.set(0,0,0);
                    torso.rotation.x = 0;
                }
            }
            return { mesh: group, armL: armLGroup, armR: armRGroup, legL: legLGroup, legR: legRGroup, gunMesh, setPosture, hp: 100, isEnemy };
        }

        function createGunMesh() {
            const g = new THREE.Group();
            const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 1.0), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.6, 0.25), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            b2.position.set(0, -0.3, 0.3); g.add(b1, b2); return g;
        }

        const player = buildHuman(0x3498db, 0x2c3e50); player.mesh.position.set(0, 0, 40); scene.add(player.mesh);

        function createWheel() {
            const wGroup = new THREE.Group();
            const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.6, 16), new THREE.MeshStandardMaterial({ color: 0x111111 })); tire.rotation.z = Math.PI / 2;
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.62, 12), new THREE.MeshStandardMaterial({ color: 0xcccccc })); rim.rotation.z = Math.PI / 2;
            wGroup.add(tire, rim); return wGroup;
        }

        function createDetailedCar(bodyColor) {
            const carGroup = new THREE.Group();
            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 7.5), new THREE.MeshStandardMaterial({ color: bodyColor })); mainBody.position.y = 1.1;
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.2, 3.8), new THREE.MeshStandardMaterial({ color: 0x111111, transparent: true, opacity: 0.45 })); cabin.position.set(0, 2.2, -0.4);
            const wFL = createWheel(); wFL.position.set(-2.1, 0.8, -2.2); const wFR = createWheel(); wFR.position.set(2.1, 0.8, -2.2);
            const wRL = createWheel(); wRL.position.set(-2.1, 0.8, 2.2); const wRR = createWheel(); wRR.position.set(2.1, 0.8, 2.2);
            
            // গাড়ির হেডলাইট এবং টেললাইট যোগ করা হলো ফ্রন্ট সাইড চেনার জন্য
            const hlL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.2), new THREE.MeshBasicMaterial({ color: 0xffffcc })); hlL.position.set(-1.2, 1.2, -3.8);
            const hlR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.2), new THREE.MeshBasicMaterial({ color: 0xffffcc })); hlR.position.set(1.2, 1.2, -3.8);
            const tlL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.2), new THREE.MeshBasicMaterial({ color: 0xff0000 })); tlL.position.set(-1.2, 1.2, 3.8);
            const tlR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.2), new THREE.MeshBasicMaterial({ color: 0xff0000 })); tlR.position.set(1.2, 1.2, 3.8);
            
            carGroup.add(mainBody, cabin, wFL, wFR, wRL, wRR, hlL, hlR, tlL, tlR); return carGroup;
        }

        function createDetailedBike(color) {
            const bikeGroup = new THREE.Group();
            const wF = createWheel(); wF.position.set(0, 0.8, -1.8); const wR = createWheel(); wR.position.set(0, 0.8, 1.8);
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 2.8), new THREE.MeshStandardMaterial({ color: 0x222222 })); frame.position.y = 1.2;
            const tank = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.7, 1.4), new THREE.MeshStandardMaterial({ color: color })); tank.position.set(0, 1.7, -0.4);
            const handle = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.15, 0.15), new THREE.MeshStandardMaterial({ color: 0xdddddd })); handle.position.set(0, 2.2, -1.1);
            
            // বাইকের হেডলাইট এবং টেললাইট যোগ করা হলো
            const headlight = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.2), new THREE.MeshBasicMaterial({ color: 0xffffcc })); headlight.position.set(0, 1.8, -1.9);
            const taillight = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0000 })); taillight.position.set(0, 1.3, 1.8);
            
            bikeGroup.add(wF, wR, frame, tank, handle, headlight, taillight); return bikeGroup;
        }

        const car = createDetailedCar(0xf1c40f); car.position.set(20, 0, 20); scene.add(car);
        const bike = createDetailedBike(0xe74c3c); bike.position.set(-20, 0, 20); scene.add(bike);

        // --- NPC এবং ট্রাফিক ---
        const npcs = [], trafficVehicles = [];
        for (let i = 0; i < 12; i++) {
            let isCar = Math.random() > 0.4;
            let veh = isCar ? createDetailedCar(Math.random() * 0xffffff) : createDetailedBike(Math.random() * 0xffffff);
            let driver = buildHuman(Math.random() * 0xffffff);
            veh.add(driver.mesh);
            driver.mesh.rotation.set(0,0,0); // পারফেক্ট ফরোয়ার্ড রোটেশন
            
            if (isCar) { driver.mesh.position.set(-0.6, 0.1, -0.2); driver.mesh.scale.set(0.65, 0.65, 0.65); driver.setPosture('SIT_CAR'); }
            else { driver.mesh.position.set(0, 1.0, -0.2); driver.mesh.scale.set(0.75, 0.75, 0.75); driver.setPosture('SIT_BIKE'); }
            
            let road = roads[Math.floor(Math.random() * roads.length)];
            veh.position.set(road, 0, (Math.random() - 0.5) * 1000);
            veh.rotation.y = Math.random() > 0.5 ? Math.PI : 0; 
            scene.add(veh);
            trafficVehicles.push({ mesh: veh, speed: 0.4 + Math.random() * 0.3 });
        }

        for (let i = 0; i < 20; i++) {
            let isEnemy = i < 5;
            let npc = buildHuman(Math.random() * 0xffffff, 0x111111, isEnemy);
            npc.mesh.position.set((Math.random() - 0.5) * 900, 0, (Math.random() - 0.5) * 900);
            if (isEnemy) npc.gunMesh.visible = true; scene.add(npc.mesh);
            npcs.push({ obj: npc, isEnemy: isEnemy, state: 'WANDER', targetPos: new THREE.Vector3((Math.random()-0.5)*900, 0, (Math.random()-0.5)*900), cooldown: 0 });
        }

        // --- আইটেম ও ফায়ার ---
        const coinsOnGround = [], gunsOnGround = [], bullets = [];
        for (let i = 0; i < 30; i++) {
            let coin = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
            coin.rotation.x = Math.PI / 2; coin.position.set((Math.random()-0.5)*1200, 1.2, (Math.random()-0.5)*1200);
            scene.add(coin); coinsOnGround.push(coin);
        }
        for (let i = 0; i < 15; i++) {
            let g = createGunMesh(); g.scale.set(1.5,1.5,1.5); g.position.set((Math.random()-0.5)*1200, 0.6, (Math.random()-0.5)*1200);
            scene.add(g); gunsOnGround.push(g);
        }

        function fireBullet(fromPos, dir, isPlayerBullet) {
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfff000 }));
            b.position.copy(fromPos); b.position.y += 2.5; scene.add(b);
            bullets.push({ mesh: b, dir: dir.clone().normalize(), life: 60, isPlayerBullet });
            if(isPlayerBullet) playSound('shoot');
        }

        // --- কন্ট্রোলস ---
        let playerCoins = 0, playerHasGun = false, playerHP = 100, stepTimer = 0;
        const btnAttack = document.getElementById('btn-attack'), btnVehicle = document.getElementById('btn-vehicle');
        const coinTxt = document.getElementById('coin-txt'), gunTxt = document.getElementById('gun-txt'), hpFill = document.getElementById('hp-fill');

        btnAttack.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (playerHasGun) {
                let dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.mesh.rotation.y);
                fireBullet(player.mesh.position, dir, true);
            } else {
                playSound('punch');
                player.armR.rotation.x = -1.5; setTimeout(() => player.armR.rotation.x = 0, 200);
                npcs.forEach(n => { if (player.mesh.position.distanceTo(n.obj.mesh.position) < 4) { n.state = 'ATTACK'; n.obj.hp -= 40; } });
            }
        });

        let joyX = 0, joyY = 0, joyTouchId = null, camAngleX = 0, camAngleY = 0.35;
        const joyBase = document.getElementById('joystick-base'), joyKnob = document.getElementById('joystick-knob');
        let baseRect = joyBase.getBoundingClientRect(); window.addEventListener('resize', () => baseRect = joyBase.getBoundingClientRect());

        joyBase.addEventListener('touchstart', e => { e.preventDefault(); joyTouchId = e.changedTouches[0].identifier; updateJoy(e.changedTouches[0]); }, { passive: false });
        window.addEventListener('touchmove', e => { for (let t of e.changedTouches) if (t.identifier === joyTouchId) updateJoy(t); }, { passive: false });
        window.addEventListener('touchend', e => { for (let t of e.changedTouches) if (t.identifier === joyTouchId) { joyTouchId = null; joyX = 0; joyY = 0; joyKnob.style.transform = `translate(0px, 0px)`; } });

        function updateJoy(touch) {
            let cx = baseRect.left + baseRect.width / 2, cy = baseRect.top + baseRect.height / 2;
            let dx = touch.clientX - cx, dy = touch.clientY - cy, dist = Math.hypot(dx, dy), maxR = 40;
            if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`; joyX = dx / maxR; joyY = dy / maxR;
        }

        let camTouchId = null, lastX = 0, lastY = 0;
        window.addEventListener('touchstart', e => { for (let t of e.changedTouches) if (t.clientX > window.innerWidth / 2 && camTouchId === null) { camTouchId = t.identifier; lastX = t.clientX; lastY = t.clientY; } }, { passive: false });
        window.addEventListener('touchmove', e => { for (let t of e.changedTouches) if (t.identifier === camTouchId) { camAngleX -= (t.clientX - lastX) * 0.007; camAngleY += (t.clientY - lastY) * 0.007; camAngleY = Math.max(0.1, Math.min(1.2, camAngleY)); lastX = t.clientX; lastY = t.clientY; } }, { passive: false });
        window.addEventListener('touchend', e => { for (let t of e.changedTouches) if (t.identifier === camTouchId) camTouchId = null; });

        let currentVehicle = 0, nearVeh = null, vehSpeed = 0;

        btnVehicle.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playSound('enter');
            if (currentVehicle === 0 && nearVeh !== null) {
                currentVehicle = nearVeh; let vObj = currentVehicle === 1 ? car : bike;
                vObj.add(player.mesh); player.mesh.rotation.set(0, 0, 0); 
                if (currentVehicle === 2) { 
                    player.mesh.position.set(0, 1.0, -0.2); // সিটিং পজিশন স্টিয়ারিংয়ের কাছে নেওয়া হয়েছে
                    player.mesh.scale.set(0.75, 0.75, 0.75); 
                    player.setPosture('SIT_BIKE'); 
                } 
                else { 
                    player.mesh.position.set(-0.6, 0.1, -0.2); 
                    player.mesh.scale.set(0.65, 0.65, 0.65); 
                    player.setPosture('SIT_CAR'); 
                }
                btnVehicle.innerText = "নামুন 🚶";
            } else if (currentVehicle !== 0) {
                let vObj = currentVehicle === 1 ? car : bike; scene.add(player.mesh);
                player.mesh.position.set(vObj.position.x - 4, 0, vObj.position.z);
                player.mesh.rotation.set(0, vObj.rotation.y, 0); player.mesh.scale.set(1, 1, 1);
                player.setPosture('STAND'); currentVehicle = 0; btnVehicle.style.display = 'none'; updateEngineSound(false, 0);
            }
        });

        // --- গেম লুপ ---
        function animate() {
            requestAnimationFrame(animate);
            let time = Date.now() * 0.003;

            trafficVehicles.forEach(tv => {
                tv.mesh.translateZ(-tv.speed); 
                if (Math.abs(tv.mesh.position.z) > 1200) { tv.mesh.position.z = Math.sign(tv.mesh.position.z) * 1199; tv.mesh.rotation.y += Math.PI; }
            });

            if (currentVehicle === 0) {
                let dC = player.mesh.position.distanceTo(car.position), dB = player.mesh.position.distanceTo(bike.position);
                if (dC < 7) { nearVeh = 1; btnVehicle.innerText = "কার-এ উঠুন 🚗"; btnVehicle.style.display = 'block'; }
                else if (dB < 6) { nearVeh = 2; btnVehicle.innerText = "বাইক-এ উঠুন 🏍️"; btnVehicle.style.display = 'block'; }
                else { nearVeh = null; btnVehicle.style.display = 'none'; }

                let fwd = -joyY, right = joyX, isMoving = Math.abs(fwd) > 0.1 || Math.abs(right) > 0.1;
                if (isMoving) {
                    let cosA = Math.cos(camAngleX), sinA = Math.sin(camAngleX);
                    let moveX = right * cosA - fwd * sinA, moveZ = -right * sinA - fwd * cosA;
                    player.mesh.position.x += moveX * 0.38; player.mesh.position.z += moveZ * 0.38;
                    player.mesh.rotation.y = Math.atan2(-moveX, -moveZ);
                    player.legL.rotation.x = Math.sin(time * 10) * 0.6; player.legR.rotation.x = Math.sin(time * 10 + Math.PI) * 0.6;
                    
                    stepTimer++; if(stepTimer > 15) { playSound('step'); stepTimer = 0; }
                } else {
                    player.legL.rotation.x = 0; player.legR.rotation.x = 0; stepTimer = 0;
                }

                let dist = 14;
                camera.position.x = player.mesh.position.x + Math.sin(camAngleX) * dist * Math.cos(camAngleY);
                camera.position.y = player.mesh.position.y + Math.sin(camAngleY) * dist + 3;
                camera.position.z = player.mesh.position.z + Math.cos(camAngleX) * dist * Math.cos(camAngleY);
                camera.lookAt(player.mesh.position.x, player.mesh.position.y + 3, player.mesh.position.z);
            } else {
                let activeVeh = currentVehicle === 1 ? car : bike;
                let turnSpeed = currentVehicle === 2 ? 0.08 : 0.05, maxSpeed = currentVehicle === 2 ? 1.25 : 0.95;

                let fwd = -joyY, right = joyX, isMoving = Math.abs(fwd) > 0.1 || Math.abs(right) > 0.1;
                if (isMoving) {
                    let cosA = Math.cos(camAngleX), sinA = Math.sin(camAngleX);
                    let moveX = right * cosA - fwd * sinA, moveZ = -right * sinA - fwd * cosA;
                    
                    let targetAngle = Math.atan2(-moveX, -moveZ);
                    let diff = targetAngle - activeVeh.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    
                    activeVeh.rotation.y += Math.sign(diff) * Math.min(Math.abs(diff), turnSpeed);
                    vehSpeed = maxSpeed * Math.hypot(joyX, joyY);
                    activeVeh.translateZ(-vehSpeed);
                    updateEngineSound(true, vehSpeed);
                } else {
                    vehSpeed *= 0.9;
                    if(vehSpeed > 0.01) activeVeh.translateZ(-vehSpeed);
                    updateEngineSound(false, 0);
                }

                let dist = 18;
                camera.position.x = activeVeh.position.x + Math.sin(camAngleX) * dist * Math.cos(camAngleY);
                camera.position.y = activeVeh.position.y + Math.sin(camAngleY) * dist + 4;
                camera.position.z = activeVeh.position.z + Math.cos(camAngleX) * dist * Math.cos(camAngleY);
                camera.lookAt(activeVeh.position.x, activeVeh.position.y + 1, activeVeh.position.z);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
